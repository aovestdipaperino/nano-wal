[package]
name = "nano-wal"
version = "1.0.0"
edition = "2021"
authors = ["Enzo Lombardi <enzinol@gmail.com>"]
description = "A concurrent Write-Ahead Log with CAS-based segment rotation and coalesced preadv reads"
license = "MIT"
repository = "https://github.com/aovestdipaperino/nano-wal"
documentation = "https://docs.rs/nano-wal"
readme = "README.md"
keywords = ["database", "storage", "wal", "write-ahead-log", "concurrent"]
categories = ["database-implementations", "data-structures", "filesystem"]

[dependencies]
bytes = "1"
arc-swap = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
